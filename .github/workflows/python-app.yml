name: python-app

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            gcc-multilib g++-multilib clang-tools clang-tidy \
            libsdl2-dev libsdl2-mixer-dev libgtest-dev
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy lizard
          npm install -g basta
      - name: QA checks
        run: make ci-qa
